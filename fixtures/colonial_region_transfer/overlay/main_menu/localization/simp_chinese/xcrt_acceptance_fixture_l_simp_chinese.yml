l_simp_chinese:
 xcrt_acceptance.1.title: "献给白绮：隔离验收场景"
 xcrt_acceptance.1.desc: "该事件只布置殖民领版图整理的验收场景，不会执行产品互动。请仅在本次隔离验收存档中继续。"
 xcrt_acceptance.1.a: "布置验收场景"
 xcrt_acceptance.2.title: "殖民领版图整理：结果审计"
 xcrt_acceptance.2.desc: "以下唯一可用按钮由游戏引擎对地点所有者、附属关系、国家生命周期和迁都结果进行判定。"
 xcrt_acceptance.2.pass: "通过：所有后置条件均成立"
 xcrt_acceptance.2.fail: "失败：至少一个后置条件不成立"
 xcrt_acceptance.audit.pass.tt: "目标殖民领取得宗主、直属附属国及下层附属国在马里恩省的地点；体系外地点、区域外地点、直属附属国生存与迁都结果全部正确。"
 xcrt_acceptance.audit.fail.tt: "后置条件不完整。保留本次 run 的日志、截图和存档，不得覆盖后重试。"
 xcrt_acceptance.3.title: "殖民领版图整理：初始状态审计"
 xcrt_acceptance.3.desc: "以下唯一可用按钮由游戏引擎判定夹具是否建立了预期的地点所有者与两层附属关系。"
 xcrt_acceptance.3.pass: "通过：初始状态可执行"
 xcrt_acceptance.3.fail: "失败：验收夹具状态无效"
 xcrt_acceptance.preflight.pass.tt: "目标殖民领、宗主直属地、直属 donor、下层 donor、体系外国家和区域外生存地点均已就位。"
 xcrt_acceptance.preflight.fail.tt: "夹具未成功建立预期状态。此失败属于 fixture/harness RED。"
 xcrt_acceptance.4.title: "负向验收：宗主首都同 Region"
 xcrt_acceptance.4.desc: "将本次隔离场景的宗主首都移到马里恩，用于验证产品在宗主与目标殖民领首都同 Region 时禁用。"
 xcrt_acceptance.4.a: "将宗主首都移至马里恩"
 xcrt_acceptance.5.title: "负向验收：恢复宗主首都"
 xcrt_acceptance.5.desc: "将宗主首都恢复到里斯本，继续其他隔离场景。"
 xcrt_acceptance.5.a: "恢复里斯本为首都"
 xcrt_acceptance.6.title: "负向验收：战争状态"
 xcrt_acceptance.6.desc: "让宗主与体系外对照国开战，用于验证产品在战争期间禁用。"
 xcrt_acceptance.6.a: "开始隔离测试战争"
 xcrt_acceptance.7.title: "负向验收：结束测试战争"
 xcrt_acceptance.7.desc: "仅结束本次隔离场景中与体系外对照国的战争。"
 xcrt_acceptance.7.a: "无条件和平"
 xcrt_acceptance.8.title: "二期验收：普通附属国主路径"
 xcrt_acceptance.8.desc: "在全新开局中布置与殖民领场景同构的普通附庸目标；该事件不执行产品互动。"
 xcrt_acceptance.8.a: "布置普通附庸目标场景"
 xcrt_acceptance.9.title: "二期验收：普通附属国结果审计"
 xcrt_acceptance.9.desc: "以下唯一可用按钮由引擎核对普通附庸目标的 Region 内外所有权与直属关系。"
 xcrt_acceptance.9.pass: "通过：普通附属国整合成功"
 xcrt_acceptance.9.fail: "失败：普通附属国后置条件不成立"
 xcrt_acceptance.phase2_vassal.pass.tt: "普通附庸作为目标完成了与殖民领相同的整合，体系外和 Region 外边界保持。"
 xcrt_acceptance.phase2.fail.tt: "二期后置条件不完整。保留本次 run 的日志、截图和存档，不得覆盖后重试。"
 xcrt_acceptance.10.title: "二期验收：土司批量上限"
 xcrt_acceptance.10.desc: "保留全新开局中的原生直属土司与其原首都，把目标配置为14个地点，并在其首都 Region 放置两个待转让地点。"
 xcrt_acceptance.10.a: "布置土司14→16禁用场景"
 xcrt_acceptance.11.title: "二期验收：土司恰好15"
 xcrt_acceptance.11.desc: "移走一个待转让地点，并把宗主首都迁出目标 Region，把场景调整为14→15；目标土司关系与首都不变，随后必须通过真实互动执行。"
 xcrt_acceptance.11.a: "调整为土司14→15场景"
 xcrt_acceptance.12.title: "二期验收：土司成功结果"
 xcrt_acceptance.12.desc: "以下按钮由引擎核对土司恰好得到第15个地点，且体系外对照不变。"
 xcrt_acceptance.12.pass: "通过：土司14→15且没有越界"
 xcrt_acceptance.12.fail: "失败：土司成功路径不成立"
 xcrt_acceptance.phase2_tusi_success.pass.tt: "目标土司恰好拥有15个地点；快照内唯一合格地点已完整转让。"
 xcrt_acceptance.13.title: "二期验收：土司15→更多禁用"
 xcrt_acceptance.13.desc: "为已经拥有15个地点的土司增加一个待转让地点；产品互动必须显示为不可用。"
 xcrt_acceptance.13.a: "增加第16个候选地点"
 xcrt_acceptance.14.title: "二期验收：土司禁用结果审计"
 xcrt_acceptance.14.desc: "以下按钮核对禁用场景没有发生部分转让。"
 xcrt_acceptance.14.pass: "通过：超限时没有转让"
 xcrt_acceptance.14.fail: "失败：超限场景发生了变化"
 xcrt_acceptance.phase2_tusi_block.pass.tt: "目标仍为15个地点，新增候选仍归宗主；没有部分转让。"
 xcrt_acceptance.15.title: "二期土司：前置条件逐项诊断"
 xcrt_acceptance.15.desc: "以下按钮只由当前引擎状态决定，不产生任何效果。候选数统计整个目标 Region 中宗主及其全部下层附属国持有的地点，而非仅统计夹具手动放置的两个地点。"
 xcrt_acceptance.15.actor_peace_pass: "通过：宗主处于和平"
 xcrt_acceptance.15.actor_peace_fail: "失败：宗主正在战争"
 xcrt_acceptance.15.target_peace_pass: "通过：目标土司处于和平"
 xcrt_acceptance.15.target_peace_fail: "失败：目标土司正在战争"
 xcrt_acceptance.15.capital_pass: "通过：宗主首都在目标 Region 外"
 xcrt_acceptance.15.capital_fail: "失败：宗主首都仍在目标 Region"
 xcrt_acceptance.15.candidates_one_or_less: "通过：整个目标 Region 至多一个合格候选"
 xcrt_acceptance.15.candidates_more_than_one: "失败：整个目标 Region 有多个合格候选"
 xcrt_acceptance.16.title: "二期验收：普通附庸取消审计"
 xcrt_acceptance.16.desc: "以下唯一可用按钮精确核对普通附庸场景的六个地点 owner、三层数量与关系。布置后及玩家取消真实互动后都必须通过。"
 xcrt_acceptance.16.pass: "通过：取消后所有状态均未变化"
 xcrt_acceptance.16.fail: "失败：至少一个取消后状态发生变化"
 xcrt_acceptance.phase2_vassal_cancel.pass.tt: "目标仍为1个地点；宗主、直属 donor、下层 donor、体系外国家和 Region 外地点的 owner、数量及关系均保持初始状态。"
 xcrt_acceptance.20.title: "二期验收：附属类型矩阵"
 xcrt_acceptance.20.desc: "在全新开局中创建9种可通用构造的领土型直属附属国，以及两个 building 型直属附属对象；其余类型按原版合法上下文分场景验收。"
 xcrt_acceptance.20.a: "布置9+2基线候选矩阵"
 xcrt_acceptance.21.title: "二期验收：类型矩阵审计"
 xcrt_acceptance.21.desc: "以下按钮核对9种基线领土型对象均有首都且为直属附属，两个非领土对象均为 building 型直属附属。"
 xcrt_acceptance.21.pass: "通过：9+2基线夹具状态成立"
 xcrt_acceptance.21.fail: "失败：至少一个类型未正确创建"
 xcrt_acceptance.phase2_matrix.pass.tt: "9种基线领土型直属附属和两种 building 型直属附属均已建立；请在真实互动选择器中核对前者出现、后者不出现，并另跑合法上下文场景。"
 xcrt_acceptance.22.title: "二期验收：类型矩阵逐项诊断"
 xcrt_acceptance.22.desc: "只显示未满足直属关系、精确附属类型、country_type 或领土型首都合同的对象；若全部成立则只显示总通过。"
