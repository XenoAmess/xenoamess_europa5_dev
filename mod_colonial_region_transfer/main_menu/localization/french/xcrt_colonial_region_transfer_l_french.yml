l_french:
 xcrt_mod_name: "Pour Vivhite : Consolidation des territoires sujets"
 xcrt_cleanup_colonial_region: "Consolider le territoire sujet"
 xcrt_cleanup_colonial_region_act: "Consolider le territoire dans la région de la capitale de [SCOPE.sCountry('recipient').GetName]"
 xcrt_cleanup_colonial_region_desc: "Transfère au sujet direct ciblé tous les lieux de la région de sa capitale détenus par nous ou par l'un de nos sujets."
 xcrt_cleanup_colonial_region_effect_text: "[SCOPE.sCountry('recipient').GetName] recevra tous les lieux de la région de sa capitale détenus par la hiérarchie de sujets de [SCOPE.sCountry('actor').GetName]"
 xcrt_cleanup_colonial_region_effect_text_past: "[SCOPE.sCountry('recipient').GetName] a reçu tous les lieux de la région de sa capitale auparavant détenus par la hiérarchie de sujets de [SCOPE.sCountry('actor').GetName]"
 PROPOSE_xcrt_cleanup_colonial_region: "Consolider le territoire dans la région de la capitale de $RECIPIENT$ ?\n\nTous les lieux qui y sont détenus par nous ou par nos sujets seront transférés à $RECIPIENT$, y compris les capitales d'autres sujets. D'autres sujets peuvent déplacer leur capitale ou disparaître. Cette action est irréversible.\n\n$INFO$"
 xcrt_select_subject: "Sélectionnez le sujet direct qui recevra toute la région de sa capitale :"
 xcrt_no_subject: "@trigger_no!Aucun sujet territorial direct admissible n'est disponible"
 xcrt_target_must_be_at_peace_tt: "Le sujet ciblé doit être en paix"
 xcrt_overlord_capital_outside_region_tt: "Les capitales du sujet ciblé et de son suzerain ne peuvent pas se trouver dans la même région"
 xcrt_affected_subjects_at_peace_tt: "Tous les sujets possédant des terres dans la région ciblée doivent être en paix"
 xcrt_has_transferable_locations_tt: "La région ciblée doit contenir au moins un lieu de la hiérarchie du suzerain que le sujet ciblé ne possède pas"
 xcrt_subject_location_limit_tt: "Si la cible est un Tusi, le transfert ne doit pas lui laisser plus de 15 lieux"
 xcrt_transfer_effect_tt: "[SCOPE.sCountry('recipient').GetName] recevra tous les lieux de la région de sa capitale détenus par [SCOPE.sCountry('actor').GetName] ou l'un de ses sujets."
 xcrt_requirements_changed_tt: "Les conditions de consolidation ont changé ; aucun lieu n'a été transféré."
 xcrt_select_subject_first_tt: "Un sujet territorial direct doit d'abord être sélectionné."
 xcrt_select_colonial_subject: "Sélectionnez le sujet direct qui recevra toute la région de sa capitale :"
 xcrt_no_colonial_subject: "@trigger_no!Aucun sujet territorial direct admissible n'est disponible"
 xcrt_select_colonial_subject_first_tt: "Un sujet territorial direct doit d'abord être sélectionné."
