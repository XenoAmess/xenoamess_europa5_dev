l_french:
 xcrt_mod_name: "Pour Vivhite : Nettoyage des frontières coloniales"
 xcrt_cleanup_colonial_region: "Réorganiser la région coloniale"
 xcrt_cleanup_colonial_region_act: "Réorganiser les frontières de la région capitale de [SCOPE.sCountry('recipient').GetName]"
 xcrt_cleanup_colonial_region_desc: "Transfère à la colonie ciblée tous les lieux de sa région capitale possédés par nous ou l'un de nos sujets."
 xcrt_cleanup_colonial_region_effect_text: "[SCOPE.sCountry('recipient').GetName] recevra tous les lieux de sa région capitale détenus par la hiérarchie de sujets de [SCOPE.sCountry('actor').GetName]"
 xcrt_cleanup_colonial_region_effect_text_past: "[SCOPE.sCountry('recipient').GetName] a reçu tous les lieux de sa région capitale auparavant détenus par la hiérarchie de sujets de [SCOPE.sCountry('actor').GetName]"
 PROPOSE_xcrt_cleanup_colonial_region: "Réorganiser les frontières de la région capitale de $RECIPIENT$ ?\n\nTous les lieux qui s'y trouvent et appartiennent à nous ou à l'un de nos sujets seront transférés à $RECIPIENT$, y compris les capitales d'autres sujets. Ces derniers peuvent déplacer leur capitale ou disparaître. Cette action est irréversible.\n\n$INFO$"
 xcrt_select_colonial_subject: "Sélectionnez la colonie qui recevra toute sa région capitale :"
 xcrt_no_colonial_subject: "@trigger_no!Aucun sujet colonial direct n'est disponible"
 xcrt_target_must_be_at_peace_tt: "La colonie ciblée doit être en paix"
 xcrt_overlord_capital_outside_region_tt: "La colonie ciblée et son suzerain ne peuvent pas avoir leur capitale dans la même région"
 xcrt_affected_subjects_at_peace_tt: "Tous les sujets possédant des terres dans la région ciblée doivent être en paix"
 xcrt_has_transferable_locations_tt: "La région ciblée doit contenir au moins un lieu de la hiérarchie du suzerain que la colonie ne possède pas encore"
 xcrt_transfer_effect_tt: "[SCOPE.sCountry('recipient').GetName] recevra tous les lieux de sa région capitale appartenant à [SCOPE.sCountry('actor').GetName] ou à l'un de ses sujets."
 xcrt_select_colonial_subject_first_tt: "Un sujet colonial direct doit d'abord être sélectionné."
