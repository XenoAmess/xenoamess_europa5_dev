l_korean:
 xcrt_mod_name: "Vivhite를 위한 식민지 국경 정리"
 xcrt_cleanup_colonial_region: "식민지 지역 국경 정리"
 xcrt_cleanup_colonial_region_act: "[SCOPE.sCountry('recipient').GetName]의 수도 지역 국경 정리"
 xcrt_cleanup_colonial_region_desc: "대상 식민지의 수도 지역에서 우리 또는 우리 종속국이 소유한 모든 지점을 해당 식민지에 양도합니다."
 xcrt_cleanup_colonial_region_effect_text: "[SCOPE.sCountry('recipient').GetName] 측은 수도 지역에서 [SCOPE.sCountry('actor').GetName]의 종속국 체계가 보유한 모든 지점을 받습니다"
 xcrt_cleanup_colonial_region_effect_text_past: "[SCOPE.sCountry('recipient').GetName] 측은 수도 지역에서 [SCOPE.sCountry('actor').GetName]의 종속국 체계가 보유하던 모든 지점을 받았습니다"
 PROPOSE_xcrt_cleanup_colonial_region: "$RECIPIENT$의 수도 지역 국경을 정리하시겠습니까?\n\n해당 지역에서 우리 또는 우리 아래의 모든 종속국이 소유한 지점을 다른 종속국의 수도까지 포함하여 $RECIPIENT$에 양도합니다. 다른 종속국은 수도를 옮기거나 소멸할 수 있습니다. 이 작업은 되돌릴 수 없습니다.\n\n$INFO$"
 xcrt_select_colonial_subject: "수도 지역 전체를 받을 식민지를 선택하십시오:"
 xcrt_no_colonial_subject: "@trigger_no!사용 가능한 직속 식민 종속국이 없습니다"
 xcrt_target_must_be_at_peace_tt: "대상 식민지는 평화 상태여야 합니다"
 xcrt_overlord_capital_outside_region_tt: "대상 식민지와 종주국의 수도는 같은 지역에 있을 수 없습니다"
 xcrt_affected_subjects_at_peace_tt: "대상 지역에 영토가 있는 모든 종속국은 평화 상태여야 합니다"
 xcrt_has_transferable_locations_tt: "대상 지역에는 대상 식민지가 아직 소유하지 않은 종주국 체계의 지점이 하나 이상 있어야 합니다"
 xcrt_transfer_effect_tt: "[SCOPE.sCountry('recipient').GetName] 측은 수도 지역에서 [SCOPE.sCountry('actor').GetName] 또는 그 아래 종속국이 소유한 모든 지점을 받습니다."
 xcrt_select_colonial_subject_first_tt: "먼저 직속 식민 종속국을 선택해야 합니다."
