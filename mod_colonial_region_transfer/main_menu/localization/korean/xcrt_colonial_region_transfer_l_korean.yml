l_korean:
 xcrt_mod_name: "Vivhite에게 바치는 종속국 영토 통합"
 xcrt_cleanup_colonial_region: "종속국 영토 통합"
 xcrt_cleanup_colonial_region_act: "[SCOPE.sCountry('recipient').GetName]의 수도 권역에 있는 종속국 영토 통합"
 xcrt_cleanup_colonial_region_desc: "대상 직속 종속국의 수도 권역에서 우리 또는 우리 휘하 종속국이 보유한 모든 지점을 대상에게 이전합니다."
 xcrt_cleanup_colonial_region_effect_text: "[SCOPE.sCountry('recipient').GetName](은)는 수도 권역에서 [SCOPE.sCountry('actor').GetName]의 종속국 체계가 보유한 모든 지점을 받습니다"
 xcrt_cleanup_colonial_region_effect_text_past: "[SCOPE.sCountry('recipient').GetName](은)는 수도 권역에서 [SCOPE.sCountry('actor').GetName]의 종속국 체계가 보유했던 모든 지점을 받았습니다"
 PROPOSE_xcrt_cleanup_colonial_region: "$RECIPIENT$의 수도 권역에 있는 종속국 영토를 통합하시겠습니까?\n\n그 권역에서 우리 또는 우리 휘하 종속국이 보유한 모든 지점이 다른 종속국의 수도를 포함하여 $RECIPIENT$에게 이전됩니다. 다른 종속국은 수도를 옮기거나 소멸할 수 있습니다. 이 작업은 되돌릴 수 없습니다.\n\n$INFO$"
 xcrt_select_subject: "수도 권역 전체를 받을 직속 종속국 선택:"
 xcrt_no_subject: "@trigger_no!이용 가능한 직속 영토형 종속국이 없습니다"
 xcrt_target_must_be_at_peace_tt: "대상 종속국은 평화 상태여야 합니다"
 xcrt_overlord_capital_outside_region_tt: "대상 종속국과 종주국의 수도는 같은 권역에 있을 수 없습니다"
 xcrt_affected_subjects_at_peace_tt: "대상 권역에 영토가 있는 모든 종속국은 평화 상태여야 합니다"
 xcrt_has_transferable_locations_tt: "대상 권역에는 대상 종속국이 소유하지 않은 종주국 체계의 지점이 하나 이상 있어야 합니다"
 xcrt_subject_location_limit_tt: "대상이 토사라면 이전 후 지점 수가 15개를 넘을 수 없습니다"
 xcrt_transfer_effect_tt: "[SCOPE.sCountry('recipient').GetName](은)는 수도 권역에서 [SCOPE.sCountry('actor').GetName] 또는 그 휘하 종속국이 보유한 모든 지점을 받습니다."
 xcrt_requirements_changed_tt: "통합 조건이 변경되어 지점이 이전되지 않았습니다."
 xcrt_select_subject_first_tt: "먼저 직속 영토형 종속국을 선택해야 합니다."
 xcrt_select_colonial_subject: "수도 권역 전체를 받을 직속 종속국 선택:"
