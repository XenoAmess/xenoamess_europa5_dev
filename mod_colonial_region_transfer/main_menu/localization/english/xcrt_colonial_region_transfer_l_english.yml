l_english:
 xcrt_mod_name: "For Vivhite: Colonial Border Cleanup"
 xcrt_cleanup_colonial_region: "Clean Up Colonial Region"
 xcrt_cleanup_colonial_region_act: "Clean up the borders in [SCOPE.sCountry('recipient').GetName]'s capital region"
 xcrt_cleanup_colonial_region_desc: "Transfer every location in the target colony's capital region owned by us or any of our subjects to that colony."
 xcrt_cleanup_colonial_region_effect_text: "[SCOPE.sCountry('recipient').GetName] will receive every location in its capital region held by [SCOPE.sCountry('actor').GetName]'s subject hierarchy"
 xcrt_cleanup_colonial_region_effect_text_past: "[SCOPE.sCountry('recipient').GetName] received every location in its capital region formerly held by [SCOPE.sCountry('actor').GetName]'s subject hierarchy"
 PROPOSE_xcrt_cleanup_colonial_region: "Clean up the borders in $RECIPIENT$'s capital region?\n\nThis transfers every location there owned by us or any subject below us to $RECIPIENT$, including other subjects' capitals. Other subjects may move their capitals or cease to exist. This cannot be undone.\n\n$INFO$"
 xcrt_select_colonial_subject: "Select the colony that will receive its entire capital region:"
 xcrt_no_colonial_subject: "@trigger_no!There is no direct colonial subject available"
 xcrt_target_must_be_at_peace_tt: "The target colony must be at peace"
 xcrt_overlord_capital_outside_region_tt: "The target colony and its overlord cannot have capitals in the same region"
 xcrt_affected_subjects_at_peace_tt: "Every subject holding land in the target region must be at peace"
 xcrt_has_transferable_locations_tt: "The target region must contain at least one location held by the overlord's hierarchy that the target colony does not already own"
 xcrt_transfer_effect_tt: "[SCOPE.sCountry('recipient').GetName] will receive every location in its capital region owned by [SCOPE.sCountry('actor').GetName] or any subject below it."
 xcrt_select_colonial_subject_first_tt: "A direct colonial subject must be selected first."
