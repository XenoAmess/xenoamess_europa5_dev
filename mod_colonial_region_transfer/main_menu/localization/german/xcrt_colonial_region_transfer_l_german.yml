 PROPOSE_xcrt_cleanup_colonial_region: "Das Gebiet in der Hauptstadtregion von $RECIPIENT$ konsolidieren?\n\nDadurch werden alle dortigen Orte, die uns oder einem unserer Untertanen gehören, an $RECIPIENT$ übertragen, einschließlich der Hauptstädte anderer Untertanen. Andere Untertanen können ihre Hauptstadt verlegen oder aufhören zu existieren. Dies kann nicht rückgängig gemacht werden.\n\n$INFO$"
 xcrt_select_subject: "Wählt den direkten Untertanen, der seine gesamte Hauptstadtregion erhalten soll:"
