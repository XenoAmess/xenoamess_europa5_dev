 xcrt_overlord_capital_outside_region_tt: "Die Hauptstädte des Zieluntertanen und seines Oberherrn dürfen nicht in derselben Region liegen"
 xcrt_affected_subjects_at_peace_tt: "Alle Untertanen mit Land in der Zielregion müssen sich im Frieden befinden"
 xcrt_has_transferable_locations_tt: "Die Zielregion muss mindestens einen Ort der Untertanenhierarchie enthalten, den der Zieluntertan noch nicht besitzt"
 xcrt_subject_location_limit_tt: "Ist das Ziel ein Tusi, darf es nach der Übertragung höchstens 15 Orte besitzen"
 xcrt_transfer_effect_tt: "[SCOPE.sCountry('recipient').GetName] erhält alle Orte seiner Hauptstadtregion, die [SCOPE.sCountry('actor').GetName] oder einem seiner Untertanen gehören."
 xcrt_requirements_changed_tt: "Die Konsolidierungsbedingungen haben sich geändert; es wurden keine Orte übertragen."
 xcrt_select_subject_first_tt: "Zuerst muss ein direkter territorialer Untertan ausgewählt werden."
 xcrt_select_colonial_subject: "Wählt den direkten Untertanen, der seine gesamte Hauptstadtregion erhalten soll:"
