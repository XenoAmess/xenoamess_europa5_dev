 xcrt_affected_subjects_at_peace_tt: "Все вассалы с землями в целевом регионе должны находиться в мире"
 xcrt_has_transferable_locations_tt: "В целевом регионе должна быть хотя бы одна точка иерархии сюзерена, которой ещё не владеет выбранный вассал"
