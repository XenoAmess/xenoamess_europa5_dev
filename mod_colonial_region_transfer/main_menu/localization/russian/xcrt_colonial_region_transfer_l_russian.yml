l_russian:
 xcrt_mod_name: "Для Vivhite: Упорядочение колониальных границ"
 xcrt_cleanup_colonial_region: "Упорядочить колониальный регион"
 xcrt_cleanup_colonial_region_act: "Упорядочить границы в столичном регионе державы [SCOPE.sCountry('recipient').GetName]"
 xcrt_cleanup_colonial_region_desc: "Передает целевой колонии все владения в ее столичном регионе, принадлежащие нам или любому из наших субъектов."
 xcrt_cleanup_colonial_region_effect_text: "[SCOPE.sCountry('recipient').GetName] получит все владения в своем столичном регионе, которыми владеет иерархия субъектов державы [SCOPE.sCountry('actor').GetName]"
 xcrt_cleanup_colonial_region_effect_text_past: "[SCOPE.sCountry('recipient').GetName] получила все владения в своем столичном регионе, прежде принадлежавшие иерархии субъектов державы [SCOPE.sCountry('actor').GetName]"
 PROPOSE_xcrt_cleanup_colonial_region: "Упорядочить границы в столичном регионе державы $RECIPIENT$?\n\nВсе находящиеся там владения, принадлежащие нам или нашим субъектам, перейдут к державе $RECIPIENT$, включая столицы других субъектов. Другие субъекты могут перенести столицу или прекратить существование. Это действие нельзя отменить.\n\n$INFO$"
 xcrt_select_colonial_subject: "Выберите колонию, которая получит весь свой столичный регион:"
 xcrt_no_colonial_subject: "@trigger_no!Нет доступного прямого колониального субъекта"
 xcrt_target_must_be_at_peace_tt: "Целевая колония должна находиться в мире"
 xcrt_overlord_capital_outside_region_tt: "Столицы целевой колонии и ее сюзерена не могут находиться в одном регионе"
 xcrt_affected_subjects_at_peace_tt: "Все субъекты с землями в целевом регионе должны находиться в мире"
 xcrt_has_transferable_locations_tt: "В целевом регионе должно быть хотя бы одно владение иерархии сюзерена, еще не принадлежащее целевой колонии"
 xcrt_transfer_effect_tt: "[SCOPE.sCountry('recipient').GetName] получит все владения в своем столичном регионе, принадлежащие державе [SCOPE.sCountry('actor').GetName] или ее субъектам."
 xcrt_select_colonial_subject_first_tt: "Сначала необходимо выбрать прямого колониального субъекта."
